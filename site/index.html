<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accessible React components with keyboard support, ARIA wiring and light and dark themes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ui-kit</title>
    <script>
      try {
        var t = localStorage.getItem("uk-docs-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
